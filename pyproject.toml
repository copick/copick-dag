[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "copick-dag"
description = "Abstract DAG-pipeline IR for copick, materializable to bash / in-memory / out-of-core backends."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
keywords = ["copick", "cryoet", "cryo-et", "tomography", "pipeline", "dag", "workflow"]
authors = [{ name = "Utz Ermel", email = "utz.ermel@czii.org" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
]
dynamic = ["version"]
dependencies = [
    "copick>=1.23.1,<2",
    "copick-utils>=1.7.0,<2",
    "pydantic>=2",
    "pyyaml>=6",
    "networkx>=3",
    "rich>=13",
    "click>=8.1",
]

[project.optional-dependencies]
dask = ["dask>=2024.1.0"]
torch = ["copick-torch>=1.2.0,<2; python_version >= '3.11'"]
all = [
    "copick-torch>=1.2.0,<2; python_version >= '3.11'",
    "dask>=2024.1.0",
]
test = [
    "pytest>=8.4.1",
    "pytest-cov>=6.2.1",
]
dev = [
    "black>=25.1.0",
    "hatchling>=1.25.0",
    "hatch-vcs>=0.4.0",
    "pre-commit>=4.2.0",
    "ruff>=0.12.0",
]

[project.scripts]
copick-dag = "copick_dag.cli:main"

[project.urls]
Repository = "https://github.com/copick/copick-dag"
Issues = "https://github.com/copick/copick-dag/issues"

[tool.hatch.version]
path = "src/copick_dag/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/copick_dag"]

[tool.black]
line-length = 120
target-version = ["py310"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.coverage.run]
source_pkgs = ["copick_dag"]
branch = true
parallel = true

[tool.coverage.paths]
copick_dag = ["src/copick_dag", "*/copick-dag/src/copick_dag"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
markers = [
    "slow: end-to-end tests that shell out to the copick CLI",
    "torch_plugin: tests that require the optional copick-torch command plugin",
]
