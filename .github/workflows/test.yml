name: Tests

on:
  push:
    branches: [main, v2.0]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-lean:
    name: lean locked py${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
        with:
          version: "0.12.4"
          python-version: ${{ matrix.python-version }}

      - name: Check lockfile
        run: uv lock --check

      - name: Install lean test environment
        run: uv sync --locked --extra test --extra dev

      - name: Verify Python and ecosystem alpha versions
        run: >
          uv run --no-sync python -c
          "import importlib.metadata as m, sys;
          expected = tuple(map(int, '${{ matrix.python-version }}'.split('.')));
          assert sys.version_info[:2] == expected, sys.version;
          assert sys.version_info.releaselevel == 'final', sys.version;
          assert m.version('copick') == '2.0.0a1';
          assert m.version('copick-utils') == '2.0.0a1';
          assert not any(d.metadata['Name'] == 'copick-torch' for d in m.distributions());
          print(sys.version)"

      - name: Run lean tests
        run: >
          uv run --no-sync pytest -q -p no:warnings
          -m "not torch_plugin"
          --cov --cov-branch --cov-report=term-missing tests

  test-torch-plugin:
    name: full torch plugin py3.12
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
        with:
          version: "0.12.4"
          python-version: "3.12"

      - name: Check lockfile
        run: uv lock --check

      - name: Install full plugin test environment
        run: uv sync --locked --extra test --extra torch

      - name: Verify exact plugin alpha
        run: >
          uv run --no-sync python -c
          "import importlib.metadata as m;
          assert m.version('copick') == '2.0.0a1';
          assert m.version('copick-utils') == '2.0.0a1';
          assert m.version('copick-torch') == '2.0.0a1'"

      - name: Run torch plugin contract tests
        run: uv run --no-sync pytest -q -p no:warnings -m torch_plugin tests

  build-inspect:
    name: build and inspect distributions
    needs: test-lean
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
        with:
          version: "0.12.4"
          python-version: "3.12"

      - name: Check lockfile
        run: uv lock --check

      - name: Install inspection environment
        run: uv sync --locked --extra test

      - name: Build distributions
        run: uv build

      - name: Inspect distributions
        run: uv run --no-sync python scripts/inspect_distribution.py dist
