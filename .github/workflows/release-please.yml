name: Create Release PRs

on:
  workflow_dispatch:
    inputs:
      target_branch:
        description: Branch to release
        required: true
        default: main
        type: choice
        options:
          - main
          - v2.0
  push:
    branches:
      - main
      - v2.0

env:
  RELEASE_TARGET_BRANCH: ${{ github.event_name == 'workflow_dispatch' && inputs.target_branch || github.ref_name }}

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release-please:
    # Creating v2.0 from main emits a push event. Wait for the first real commit
    # so the initial alpha can be bootstrapped deliberately with Release-As.
    if: github.event_name == 'workflow_dispatch' || github.event.created == false
    concurrency:
      group: ${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && inputs.target_branch || github.ref_name }}
      cancel-in-progress: true

    runs-on: ubuntu-latest
    steps:
      - name: Release Please
        uses: googleapis/release-please-action@v5
        id: release
        with:
          manifest-file: ".release-please.manifest.json"
          config-file: ${{ env.RELEASE_TARGET_BRANCH == 'v2.0' && 'release-please.prerelease.config.json' || 'release-please.config.json' }}
          target-branch: ${{ env.RELEASE_TARGET_BRANCH }}
          token: ${{ secrets.GITHUB_TOKEN }}

    outputs:
      paths_released: ${{ steps.release.outputs.paths_released }}
      release_created: ${{ steps.release.outputs.release_created }}
      sha: ${{ steps.release.outputs.sha }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}

  build-release:
    name: Build release artifacts
    runs-on: ubuntu-latest
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    steps:
      - name: Checkout released commit
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.sha }}
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.12.4"
          python-version: "3.12"

      - name: Build distributions
        run: uv build

      - name: Keep the release artifacts (not published)
        uses: actions/upload-artifact@v7
        with:
          name: copick-dag-${{ needs.release-please.outputs.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 7

  # PyPI publication is intentionally disabled. Release Please may create a
  # GitHub release, but this workflow stops after building and retaining the
  # artifacts. Adding a publisher requires a separate, explicit repository
  # change and review.
